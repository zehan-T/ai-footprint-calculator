<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d16" />
    <title>Virtual Hallo“weenie”</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="experience" aria-label="Virtual Halloween park entrance">
      <div class="scene" aria-hidden="true">
        <img
          class="scene-background"
          src="assets/backgrounds/moonlight-midway-younger-v2.jpg"
          alt=""
          width="941"
          height="1680"
        />
        <div class="scene-grade"></div>

        <div class="effects-layer effects-layer--back ambient-layer">
          <div class="cloud-veil cloud-veil--left ambient"></div>
          <div class="cloud-veil cloud-veil--right ambient"></div>
          <div class="fog fog-back ambient"></div>
        </div>

        <div class="effects-layer effects-layer--particles ambient-layer">
          <span class="mote mote--1 ambient"></span>
          <span class="mote mote--2 ambient"></span>
          <span class="mote mote--3 ambient"></span>
          <span class="mote mote--4 ambient"></span>
          <span class="mote mote--5 ambient"></span>
          <span class="leaf leaf--1 ambient"></span>
          <span class="leaf leaf--2 ambient"></span>
          <span class="leaf leaf--3 ambient"></span>
          <span class="leaf leaf--4 ambient"></span>
          <span class="leaf leaf--5 ambient"></span>
          <span class="leaf leaf--6 ambient"></span>
          <span class="leaf leaf--7 ambient"></span>
          <span class="leaf leaf--8 ambient"></span>
          <span class="leaf leaf--9 ambient"></span>
          <div class="firefly-field">
            <span class="firefly firefly--1 ambient"></span>
            <span class="firefly firefly--2 ambient"></span>
            <span class="firefly firefly--3 ambient"></span>
            <span class="firefly firefly--4 ambient"></span>
            <span class="firefly firefly--5 ambient"></span>
            <span class="firefly firefly--6 ambient"></span>
            <span class="firefly firefly--7 ambient"></span>
            <span class="firefly firefly--8 ambient"></span>
          </div>
        </div>

        <div class="ambient-light ambient-light--lamp ambient"></div>
        <div class="ticket-flutter-field" aria-hidden="true">
          <span class="ticket ticket--1 ambient"></span>
          <span class="ticket ticket--2 ambient"></span>
          <span class="ticket ticket--3 ambient"></span>
          <span class="ticket ticket--4 ambient"></span>
        </div>
        <div class="story-effects" id="story-effects"></div>
        <div class="fog fog-front ambient"></div>

        <svg class="foreground-silhouette" viewBox="0 0 390 844" preserveAspectRatio="none">
          <path class="branch branch-left" d="M0 90c22 30 30 67 31 110 18-29 30-48 59-65M24 168c-5-25-11-43-24-58M31 203c24-17 39-28 62-29" />
          <path class="branch branch-right" d="M390 43c-28 38-37 83-35 138-18-31-33-49-62-62m64 34c11-23 20-41 33-51m-37 83c-25-14-42-21-68-18" />
          <path class="foreground-grass" d="m0 823 18-45 1 47 20-30-8 40 28-18m331 5-17-50-2 52-19-35 5 42-25-19" />
        </svg>
        <div class="vignette"></div>
      </div>

      <div class="interaction-layer is-hidden" id="interaction-layer" aria-hidden="true">
        <button class="scene-target scene-target--booth" type="button" tabindex="-1" data-target="booth" aria-label="Old ticket booth"></button>
        <button class="scene-target scene-target--carousel" type="button" tabindex="-1" data-target="carousel" aria-label="Antique carousel"></button>
        <button class="scene-target scene-target--lamp" type="button" tabindex="-1" data-target="lamp" aria-label="Crow on the lamp"></button>
      </div>

      <header class="hud is-hidden" id="scene-hud">
        <div class="brand-mark" aria-label="Moonlight Midway">MM</div>
        <p>Three surprises glow in the midway</p>
        <button class="pause-button" id="pause-button" type="button" aria-label="Pause experience" aria-pressed="false" disabled>
          <span class="pause-icon" aria-hidden="true">Ⅱ</span>
        </button>
      </header>

      <section class="start-screen" id="start-screen" aria-labelledby="app-title">
        <p class="eyebrow">A moonlit adventure awaits</p>
        <h1 id="app-title"><span>Virtual</span> Hallo<span class="quote">“</span>weenie<span class="quote">”</span></h1>
        <p class="intro">Step into Moonlight Midway and discover three magical surprises.</p>
        <button id="enter-button" class="enter-button" type="button">
          <span>Enter the midway</span>
          <span aria-hidden="true">→</span>
        </button>
        <p class="audio-note">Sound begins after you enter</p>
      </section>

      <div class="scene-caption is-hidden" id="scene-caption" role="status" aria-live="polite">
        <span class="caption-dash"></span>
        Follow the lights. The midway has secrets to share.
        <span class="caption-dash"></span>
      </div>

      <div class="transition-curtain" id="transition-curtain" aria-hidden="true"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
