<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d16" />
    <title>Virtual Hallo“weenie”</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="experience" aria-label="Virtual Halloween park entrance">
      <div class="scene" aria-hidden="true">
        <img
          class="scene-background"
          src="assets/backgrounds/moonlight-midway-realistic-v1.jpg"
          alt=""
          width="941"
          height="1680"
        />
        <div class="scene-grade"></div>
        <div class="fog fog-back"></div>
        <div class="fog fog-front"></div>
        <div class="vignette"></div>
      </div>

      <header class="hud is-hidden" id="scene-hud">
        <div class="brand-mark" aria-label="Moonlight Midway">MM</div>
        <p>Three secrets sleep in the midway</p>
        <button class="pause-button" type="button" aria-label="Pause experience" disabled>
          <span aria-hidden="true">Ⅱ</span>
        </button>
      </header>

      <section class="start-screen" id="start-screen" aria-labelledby="app-title">
        <p class="eyebrow">The gates open after dark</p>
        <h1 id="app-title"><span>Virtual</span> Hallo<span class="quote">“</span>weenie<span class="quote">”</span></h1>
        <p class="intro">Step into Moonlight Midway and wake the park’s three restless spirits.</p>
        <button id="enter-button" class="enter-button" type="button">
          <span>Enter the midway</span>
          <span aria-hidden="true">→</span>
        </button>
        <p class="audio-note">Sound begins after you enter</p>
      </section>

      <div class="scene-caption is-hidden" id="scene-caption" role="status" aria-live="polite">
        <span class="caption-dash"></span>
        Look closely. The midway remembers.
        <span class="caption-dash"></span>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
